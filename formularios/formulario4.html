<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Novo Usuário</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    
    <h3 class="mb-4">Novo Usuário</h3>

    <form>

        <!-- Nome -->
        <div class="mb-3">
            <label class="form-label">Nome:</label>
            <input type="text" class="form-control" placeholder="Informe o nome.">
        </div>

        <!-- CPF / Endereço / Nível -->
        <div class="row mb-3">

            <div class="col-md-3">
                <label class="form-label">CPF:</label>
                <input type="text" class="form-control" placeholder="Informe o cpf">
            </div>

            <div class="col-md-7">
                <label class="form-label">Endereço:</label>
                <input type="text" class="form-control" placeholder="Informe o endereço.">
            </div>

            <div class="col-md-2">
                <label class="form-label">Nível:</label>
                <select class="form-select">
                    <option>--</option>
                    <option>Administrador</option>
                    <option>Usuário</option>
                </select>
            </div>

        </div>

        <!-- Email / Senha / Status -->
        <div class="row mb-3">

            <div class="col-md-6">
                <label class="form-label">Email:</label>
                <input type="email" class="form-control" placeholder="Informe o email.">
            </div>

            <div class="col-md-4">
                <label class="form-label">Senha:</label>
                <input type="password" class="form-control" placeholder="Informe a senha.">
            </div>

            <div class="col-md-2">
                <label class="form-label">Status:</label>
                <select class="form-select">
                    <option>--</option>
                    <option>Ativo</option>
                    <option>Inativo</option>
                </select>
            </div>

        </div>

        <!-- Botões -->
        <div class="text-end">
            <button type="submit" class="btn btn-success">Enviar</button>
            <button type="reset" class="btn btn-secondary">Cancelar</button>
        </div>

    </form>

</div>

</body>
</html>
