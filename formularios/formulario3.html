<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Sample Form</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h3 class="text-center mb-4">Sample Form</h3>

<form>

<div class="row mb-3">

<div class="col-md-6">
<label class="form-label">Partner Name</label>
<input type="text" class="form-control">
</div>

<div class="col-md-6">
<label class="form-label">Partner Email ID</label>
<input type="email" class="form-control">
</div>

</div>


<div class="row mb-3">

<div class="col-md-6">
<label class="form-label">Partner Legal Name</label>
<input type="text" class="form-control">
</div>

<div class="col-md-6">
<label class="form-label">Partner Mobile</label>
<input type="text" class="form-control">
</div>

</div>


<div class="row mb-3">

<div class="col-12">
<label class="form-label">Partner Address</label>
<textarea class="form-control" rows="3"></textarea>
</div>

</div>


<div class="row mb-3">

<div class="col-md-6">
<label class="form-label">Contract Start Date</label>
<input type="date" class="form-control">
</div>

<div class="col-md-6">
<label class="form-label">Contract Expiry Date</label>
<input type="date" class="form-control">
</div>

</div>


<div class="row mb-3">

<div class="col-md-6">
<label class="form-label">Minimum Loan Amount</label>
<input type="number" class="form-control">
</div>

<div class="col-md-6">
<label class="form-label">Maximum Loan Amount</label>
<input type="number" class="form-control">
</div>

</div>


<div class="row mb-3">

<div class="col-md-6">
<label class="form-label">Interest Rate</label>
<input type="text" class="form-control">
</div>

<div class="col-md-6">
<label class="form-label">Deposit Amount</label>
<input type="text" class="form-control">
</div>

</div>


<div class="text-center mt-4">
<button class="btn btn-primary">Save</button>
</div>

</form>

</div>

</body>
</html>
