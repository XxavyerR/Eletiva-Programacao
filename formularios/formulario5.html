<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billing Address</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5" style="max-width:700px;">

<h4 class="mb-3">Billing address</h4>

<form>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">First name</label>
<input type="text" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Last name</label>
<input type="text" class="form-control">
</div>

</div>

<div class="mb-3">
<label class="form-label">Username</label>

<div class="input-group">
<span class="input-group-text">@</span>
<input type="text" class="form-control" placeholder="Username">
</div>

</div>

<div class="mb-3">
<label class="form-label">Email <span class="text-muted">(Optional)</span></label>
<input type="email" class="form-control" placeholder="you@example.com">
</div>

<div class="mb-3">
<label class="form-label">Address</label>
<input type="text" class="form-control" placeholder="1234 Main St">
</div>

<div class="mb-3">
<label class="form-label">Address 2 <span class="text-muted">(Optional)</span></label>
<input type="text" class="form-control" placeholder="Apartment or suite">
</div>

<div class="row">

<div class="col-md-5 mb-3">
<label class="form-label">Country</label>
<select class="form-select">
<option>Choose...</option>
<option>Brazil</option>
<option>USA</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label class="form-label">State</label>
<select class="form-select">
<option>Choose...</option>
</select>
</div>

<div class="col-md-3 mb-3">
<label class="form-label">Zip</label>
<input type="text" class="form-control">
</div>

</div>

</form>

</div>

</body>
</html>
