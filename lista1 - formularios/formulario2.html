<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário 2</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    .form-label {
        font-size: 0.85rem;
        margin-bottom: 2px;
    }
</style>

</head>
<body>

<div class="container mt-4">
    <h5 class="mb-3">Formulário 2</h5>

    <form>

        <!-- LINHA 1 -->
        <div class="row gx-1 gy-2 align-items-end">

            <div class="col-md-1">
                <label class="form-label">Código</label>
                <input type="number" class="form-control form-control-sm text-center" value="32">
            </div>

            <div class="col-md-4">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control form-control-sm" placeholder="Nome Completo do Cliente">
            </div>

            <div class="col-md-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control form-control-sm" placeholder="cliente@dominio.com">
            </div>

            <div class="col-md-2">
                <label class="form-label">CPF</label>
                <input type="text" class="form-control form-control-sm" placeholder="Só números">
            </div>

        </div>

        <!-- LINHA 2 -->
        <div class="row gx-1 gy-2 mt-2 align-items-end">

            <div class="col-md-2">
                <label class="form-label">Nº Celular</label>
                <input type="text" class="form-control form-control-sm" placeholder="Nº do celular">
            </div>

            <div class="col-md-2">
                <label class="form-label">Nº Telefone fixo</label>
                <input type="text" class="form-control form-control-sm" placeholder="Nº telefone">
            </div>

            <div class="col-md-2">
                <label class="form-label">CEP</label>
                <input type="text" class="form-control form-control-sm" placeholder="ex:88308070">
            </div>

            <div class="col-md-2">
                <label class="form-label">Logradouro</label>
                <input type="text" class="form-control form-control-sm" placeholder="ex:Rua 1400">
            </div>

            <div class="col-md-1">
                <label class="form-label">Nº</label>
                <input type="text" class="form-control form-control-sm" placeholder="Nº">
            </div>

            <div class="col-md-3">
                <label class="form-label">Bairro</label>
                <input type="text" class="form-control form-control-sm" placeholder="Bairro">
            </div>

        </div>

        <!-- LINHA 3 -->
        <div class="row gx-1 gy-2 mt-2 align-items-end">

            <div class="col-md-3">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control form-control-sm" placeholder="Cidade">
            </div>

            <div class="col-md-1">
                <label class="form-label">UF</label>
                <input type="text" class="form-control form-control-sm" placeholder="UF">
            </div>

            <div class="col-md-2">
                <label class="form-label">Status</label>
                <select class="form-select form-select-sm">
                    <option selected>Selecione</option>
                    <option>Ativo</option>
                    <option>Inativo</option>
                </select>
            </div>

        </div>

        <!-- BOTÕES -->
        <div class="row mt-4">
            <div class="col text-end">
                <button type="reset" class="btn btn-danger btn-sm">
                    Resetar
                </button>
                <button type="submit" class="btn btn-success btn-sm">
                    Próximo
                </button>
            </div>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
