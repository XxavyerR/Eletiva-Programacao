<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 1</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h4 class="mb-4">Formulário 1</h4>

    <form class="row g-3">

        <!-- Primeiro Nome -->
        <div class="col-md-4">
            <label for="Primeiro Nome" class="form-label">Primeiro Nome</label>
            <input type="text" class="form-control" id="Primeiro Nome" placeholder="Nome">
        </div>

        <!-- Ultimo Nome  -->
        <div class="col-md-4">
            <label for="ultimonome" class="form-label">Último Nome</label>
            <input type="text" class="form-control" id="ultimonome" placeholder="Sobrenome">
        </div>

        <!-- Username -->
        <div class="col-md-4">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text">@</span>
                <input type="text" class="form-control" id="username" placeholder="Username">
            </div>
        </div>

        <!-- Cidade -->
        <div class="col-md-6">
            <label for="Cidade" class="form-label">Cidade</label>
            <input type="text" class="form-control" id="Cidade" placeholder="Cidade">
        </div>

        <!-- Estado -->
        <div class="col-md-3">
            <label for="Estado" class="form-label">Estado</label>
            <input type="text" class="form-control" id="Estado" placeholder="Estado">
        </div>

        <!-- Código Postal -->
        <div class="col-md-3">
            <label for="Código Postal" class="form-label">Código Postal</label>
            <input type="text" class="form-control" id="Código Postal" placeholder="Código Postal">
        </div>

        <!-- Checkbox -->
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="terms">
                <label class="form-check-label" for="terms">
                    Aceito os termos e condições
                </label>
            </div>
        </div>

        <!-- Botão -->
        <div class="col-12">
            <button type="submit" class="btn btn-primary">
                Enviar Formulário
            </button>
        </div>

    </form>
</div>

</body>
</html>
